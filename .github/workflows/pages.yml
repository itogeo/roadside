name: Deploy site
# Publishes site/ to GitHub Pages on every push to main. Enables Pages on first run;
# nothing to switch on in Settings. Pure upload — no build step, so it finishes in well under a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on for the repo the first time this runs,
      # so a fresh clone or fork needs nothing clicked in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
